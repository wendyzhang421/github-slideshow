<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Price Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .crypto-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .crypto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }

        .crypto-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .crypto-icon {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            border-radius: 50%;
        }

        .crypto-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        .crypto-symbol {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
        }

        .price-display {
            margin-bottom: 20px;
        }

        .current-price {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .price-change {
            font-size: 1.1rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 10px;
            display: inline-block;
        }

        .positive {
            background-color: #d4edda;
            color: #155724;
        }

        .negative {
            background-color: #f8d7da;
            color: #721c24;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.03);
            border-radius: 10px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .last-updated {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }

        .chart-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .error {
            text-align: center;
            color: #e74c3c;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .dashboard {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .crypto-card {
                padding: 20px;
            }
            
            .current-price {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Crypto Dashboard</h1>
            <p>Real-time Bitcoin & Ethereum prices</p>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading crypto data...</p>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">Price Trends (24h)</div>
            <canvas id="priceChart" width="400" height="200"></canvas>
        </div>

        <div class="last-updated" id="lastUpdated"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        class CryptoDashboard {
            constructor() {
                this.apiUrl = 'https://api.coingecko.com/api/v3';
                this.cryptos = ['bitcoin', 'ethereum'];
                this.chart = null;
                this.priceHistory = {
                    bitcoin: [],
                    ethereum: []
                };
                this.init();
            }

            async init() {
                try {
                    await this.fetchCryptoData();
                    this.setupChart();
                    this.startPeriodicUpdates();
                } catch (error) {
                    this.showError('Failed to load crypto data. Please check your internet connection.');
                    console.error('Error initializing dashboard:', error);
                }
            }

            async fetchCryptoData() {
                try {
                    const response = await fetch(
                        `${this.apiUrl}/simple/price?ids=${this.cryptos.join(',')}&vs_currencies=usd&include_24hr_change=true&include_24hr_vol=true&include_market_cap=true&include_last_updated_at=true`
                    );
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    this.renderDashboard(data);
                    this.updatePriceHistory(data);
                    this.updateLastUpdated();
                } catch (error) {
                    throw new Error(`Failed to fetch crypto data: ${error.message}`);
                }
            }

            renderDashboard(data) {
                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = '';

                const cryptoInfo = {
                    bitcoin: {
                        name: 'Bitcoin',
                        symbol: 'BTC',
                        icon: 'https://assets.coingecko.com/coins/images/1/large/bitcoin.png',
                        color: '#f7931a'
                    },
                    ethereum: {
                        name: 'Ethereum',
                        symbol: 'ETH',
                        icon: 'https://assets.coingecko.com/coins/images/279/large/ethereum.png',
                        color: '#627eea'
                    }
                };

                this.cryptos.forEach(crypto => {
                    const cryptoData = data[crypto];
                    const info = cryptoInfo[crypto];
                    
                    if (cryptoData) {
                        const card = this.createCryptoCard(cryptoData, info);
                        dashboard.appendChild(card);
                    }
                });
            }

            createCryptoCard(data, info) {
                const card = document.createElement('div');
                card.className = 'crypto-card';

                const priceChange = data.usd_24h_change || 0;
                const changeClass = priceChange >= 0 ? 'positive' : 'negative';
                const changeSymbol = priceChange >= 0 ? '+' : '';

                card.innerHTML = `
                    <div class="crypto-header">
                        <img src="${info.icon}" alt="${info.name}" class="crypto-icon" onerror="this.style.display='none'">
                        <div>
                            <div class="crypto-name">${info.name}</div>
                            <div class="crypto-symbol">${info.symbol}</div>
                        </div>
                    </div>
                    <div class="price-display">
                        <div class="current-price">$${this.formatPrice(data.usd)}</div>
                        <div class="price-change ${changeClass}">
                            ${changeSymbol}${priceChange.toFixed(2)}%
                        </div>
                    </div>
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-label">Market Cap</div>
                            <div class="stat-value">$${this.formatLargeNumber(data.usd_market_cap)}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">24h Volume</div>
                            <div class="stat-value">$${this.formatLargeNumber(data.usd_24h_vol)}</div>
                        </div>
                    </div>
                `;

                return card;
            }

            formatPrice(price) {
                if (price >= 1000) {
                    return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                } else {
                    return price.toFixed(4);
                }
            }

            formatLargeNumber(num) {
                if (num >= 1e12) {
                    return (num / 1e12).toFixed(1) + 'T';
                } else if (num >= 1e9) {
                    return (num / 1e9).toFixed(1) + 'B';
                } else if (num >= 1e6) {
                    return (num / 1e6).toFixed(1) + 'M';
                } else if (num >= 1e3) {
                    return (num / 1e3).toFixed(1) + 'K';
                } else {
                    return num.toFixed(0);
                }
            }

            updatePriceHistory(data) {
                const timestamp = new Date().toLocaleTimeString();
                
                this.cryptos.forEach(crypto => {
                    if (data[crypto]) {
                        this.priceHistory[crypto].push({
                            time: timestamp,
                            price: data[crypto].usd
                        });
                        
                        // Keep only last 20 data points
                        if (this.priceHistory[crypto].length > 20) {
                            this.priceHistory[crypto].shift();
                        }
                    }
                });

                this.updateChart();
            }

            setupChart() {
                const ctx = document.getElementById('priceChart').getContext('2d');
                this.chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [
                            {
                                label: 'Bitcoin (USD)',
                                data: [],
                                borderColor: '#f7931a',
                                backgroundColor: 'rgba(247, 147, 26, 0.1)',
                                tension: 0.4,
                                yAxisID: 'y'
                            },
                            {
                                label: 'Ethereum (USD)',
                                data: [],
                                borderColor: '#627eea',
                                backgroundColor: 'rgba(98, 126, 234, 0.1)',
                                tension: 0.4,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: {
                                    display: true,
                                    text: 'Bitcoin Price (USD)'
                                }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: {
                                    display: true,
                                    text: 'Ethereum Price (USD)'
                                },
                                grid: {
                                    drawOnChartArea: false,
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top'
                            }
                        }
                    }
                });
            }

            updateChart() {
                if (!this.chart) return;

                const labels = this.priceHistory.bitcoin.map(item => item.time);
                const bitcoinPrices = this.priceHistory.bitcoin.map(item => item.price);
                const ethereumPrices = this.priceHistory.ethereum.map(item => item.price);

                this.chart.data.labels = labels;
                this.chart.data.datasets[0].data = bitcoinPrices;
                this.chart.data.datasets[1].data = ethereumPrices;
                this.chart.update('none');
            }

            updateLastUpdated() {
                const now = new Date();
                const timeString = now.toLocaleString();
                document.getElementById('lastUpdated').textContent = `Last updated: ${timeString}`;
            }

            startPeriodicUpdates() {
                // Update every 30 seconds
                setInterval(() => {
                    this.fetchCryptoData().catch(error => {
                        console.error('Error updating crypto data:', error);
                    });
                }, 30000);
            }

            showError(message) {
                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = `
                    <div class="error">
                        <h3>⚠️ Error</h3>
                        <p>${message}</p>
                        <button onclick="location.reload()" style="margin-top: 10px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;">
                            Retry
                        </button>
                    </div>
                `;
            }
        }

        // Initialize dashboard when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new CryptoDashboard();
        });
    </script>
</body>
</html>
